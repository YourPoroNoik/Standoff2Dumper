name: Build Dumper
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Build
        run: |
          # Ищем, где лежит CMakeLists.txt
          find . -name "CMakeLists.txt"
          
          # Заходим в папку с проектом (подставьте правильный путь, если он другой)
          cd dumper 
          
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          ninja
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dumper-so
          path: dumper/build/*.so
